name: Release binaries

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "13"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"

    steps:
      - uses: actions/checkout@v5

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.4
        with:
          cache: true
          cache-on-failure: true
          cache-key: "release-${{ matrix.target }}"
          target: ${{ matrix.target }}

      - name: Build binaries
        run: cargo build --profile ci --target ${{ matrix.target }} -p fff-mcp -p fffq

      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/ci/fff-mcp${{ matrix.ext }}" "dist/fff-mcp-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/ci/fffq${{ matrix.ext }}" "dist/fffq-${{ matrix.target }}${{ matrix.ext }}"
          cd dist
          for file in *; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$file" > "$file.sha256"
            else
              shasum -a 256 "$file" > "$file.sha256"
            fi
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA::7}"
          gh release delete "$tag" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$tag" dist/* \
            --title "fff ${tag}" \
            --notes "Automated binary release for ${GITHUB_SHA}." \
            --prerelease
